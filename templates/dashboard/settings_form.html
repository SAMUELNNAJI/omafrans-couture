{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site settings | Omafrans Couture</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <main class="dash-main dash-edit">
    <a class="auth-back" href="{% url 'dashboard:index' %}">&larr; Back to dashboard</a>
    <section class="dash-form-panel">
      <span class="tag">// Site settings</span>
      <h1>Contact details</h1>
      <p class="dash-note">These details update the phone, email and WhatsApp links shown across the public site.</p>
      <form method="post" class="dash-edit-form">
        {% csrf_token %}
        {% for field in form %}
          <label>{{ field.label }}
            {{ field }}
            {% for error in field.errors %}<small class="dash-error">{{ error }}</small>{% endfor %}
          </label>
        {% endfor %}
        <div class="dash-form-actions">
          <button type="submit" class="dash-add">Save settings</button>
          <a href="{% url 'dashboard:index' %}" class="dash-cancel">Cancel</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
