services:
  - type: web
    name: omafrans-couture
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn omafrans_config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 180 --graceful-timeout 30 --keep-alive 5
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ""        # leave blank — RENDER_EXTERNAL_HOSTNAME is picked up automatically
      - key: DATABASE_URL
        fromDatabase:
          name: omafrans-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.3"
      # Add your API keys here or set them in the Render dashboard
      # - key: POLLINATIONS_API_KEY
      #   value: ""
      # - key: GEMINI_API_KEY
      #   value: ""

databases:
  - name: omafrans-db
    plan: free
    region: frankfurt
