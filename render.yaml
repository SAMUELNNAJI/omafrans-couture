services:
  - type: web
    name: omafrans-couture
    runtime: python
    region: frankfurt          # closest to Nigeria
    plan: free
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: gunicorn omafrans_config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render generates a secure random value
      - key: DJANGO_ALLOWED_HOSTS
        value: ""                    # leave blank; RENDER_EXTERNAL_HOSTNAME is used automatically
      - key: DATABASE_URL
        fromDatabase:
          name: omafrans-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.3"

databases:
  - name: omafrans-db
    plan: free
    region: frankfurt
